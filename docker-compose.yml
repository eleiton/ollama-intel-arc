version: "3.8"

services:
  ollama-intel-arc:
    image: intelanalytics/ipex-llm-inference-cpp-xpu:latest
    #build:
    #  context: ./ipex-ollama
    #  dockerfile: Dockerfile
    #  args:
    #    IPEXLLM_RELEASE_REPO: ipex-llm/ipex-llm
    #    IPEXLLM_RELEASE_VERSON: v2.3.0
    #    IPEXLLM_PORTABLE_ZIP_FILENAME: ollama-ipex-llm-2.2.0-ubuntu.tgz
    container_name: ollama-intel-arc
    restart: unless-stopped

    shm_size: "16G"                        # Shared memory limit (/dev/shm). Docker defaults to 64 MB which is too small
                                           # for SYCL kernel caches, Level Zero buffers, and memory-mapped model loading.
                                           # Does NOT pre-allocate — only sets the upper bound. Match your RAM or VRAM.

    devices:
      - /dev/dri:/dev/dri                 # Required: maps Intel GPU render & card nodes for SYCL / Level Zero access

    volumes:
      - ollama-volume:/root/.ollama       # Persistent storage for downloaded models, Modelfiles, and runtime configs

    ports:
      - 11434:11434                       # Exposes Ollama API (default port)

    environment:
      # ───────────────────────────────────────────────────────────────
      # Proxy bypass — prevents corporate/system HTTP proxies from
      # intercepting container-to-container and localhost traffic.
      # Without this, model downloads may work but inter-service
      # calls (Open WebUI → Ollama) can silently fail or time out.
      # ───────────────────────────────────────────────────────────────
      - no_proxy=${no_proxy:-localhost,127.0.0.1,ollama-intel-arc,open-webui}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,ollama-intel-arc,open-webui}

      # ───────────────────────────────────────────────────────────────
      # Ollama server & runtime behavior
      # ───────────────────────────────────────────────────────────────
      - OLLAMA_HOST=0.0.0.0
        # Impact: Allows connections from host network (e.g. Open WebUI, other machines). Default is 127.0.0.1 (localhost only).

      - OLLAMA_NUM_PARALLEL=1
        # Impact: Maximum concurrent requests per model. Each parallel slot roughly duplicates KV cache VRAM usage.
        # On 16 GB Arc A770M → 1 is safest to avoid OOM; 2–4 only viable with short context (<8k) + small models + heavy quantization.

      - OLLAMA_DEFAULT_KEEPALIVE=6h
        # Impact: Fallback keep-alive duration when client does not specify. Mostly redundant with next var.

      - OLLAMA_KEEP_ALIVE=24h
        # Impact: How long models stay loaded in VRAM after last use. Longer = faster subsequent requests, but keeps VRAM occupied.

      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
        # Impact: Limits how many models can be loaded simultaneously. Prevents VRAM thrashing on memory-constrained hardware like A770M.

      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-512}
        # Impact: Maximum queued requests before server starts rejecting. Higher = more tolerant to bursts, but can increase memory pressure.

      - OLLAMA_MAX_VRAM=${OLLAMA_MAX_VRAM:-0}
        # Impact: No real effect in current Ollama (placeholder / legacy). Ignored by server.

      # ───────────────────────────────────────────────────────────────
      # Context length & KV cache quantization (biggest VRAM consumers)
      # ───────────────────────────────────────────────────────────────
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-16384}
        # Impact: Default tokens of context window. KV cache scales ~linearly with this value.
        # 16384 is realistic safe default on 16 GB A770M for 7–13B models at q4/q5.
        # 8192 → very safe, 32768 → often OOM unless small model + q4_0 KV.

      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q4_0}
        # Impact: Quantization of key/value cache (biggest VRAM user after model weights).
        # Options:
        #   f16 (default)   → highest quality, highest VRAM (~2× q8_0)
        #   q8_0            → ~half VRAM of f16, very small quality drop (recommended balance)
        #   q4_0            → ~quarter VRAM of f16, noticeable quality drop especially on long context / reasoning
        # q4_0 allows higher context or more parallel on 16 GB; q8_0 is better quality trade-off.

      # ───────────────────────────────────────────────────────────────
      # Attention & acceleration features
      # ───────────────────────────────────────────────────────────────
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
        # Impact: Enables flash attention implementation if compiled in. Usually 10–30% faster inference, lower memory peak on supported models.

      # ───────────────────────────────────────────────────────────────
      # Intel IPEX-LLM / SYCL / Arc GPU tuning
      # ───────────────────────────────────────────────────────────────
      - ZES_ENABLE_SYSMAN=${ZES_ENABLE_SYSMAN:-0}
        # Impact: Enables Intel Sysman for GPU monitoring, power & frequency control, accurate VRAM reporting.
        # 0 = disabled → slightly lower driver overhead, but worse logs/tools visibility (many users prefer 1).

      - USE_XETLA=${USE_XETLA:-OFF}
        # Impact: OFF = enable XeTLA (optimized tensor kernels for Arc GPUs) → usually better performance.
        # ON = disable XeTLA → fallback kernels (slower; only use if XeTLA causes crashes).

      - SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=${SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS:-1}
        # Impact: Uses immediate command lists instead of in-order. Often reduces latency / improves throughput on Arc.
        # Sometimes degrades performance or stability depending on driver/kernel — test with/without.

      - ENABLE_SDP_FUSION=${ENABLE_SDP_FUSION:-1}
        # Impact: Enables fused scaled dot-product attention kernels. Small to moderate speedup in attention-heavy models.

      - SYCL_CACHE_PERSISTENT=${SYCL_CACHE_PERSISTENT:-1}
        # Impact: Keeps compiled SYCL kernels in persistent cache → significantly faster second+ runs.
        # Rare cases cause compile errors; unset if you see "Build program log" failures.

      # ───────────────────────────────────────────────────────────────
      # NPU support (not relevant for discrete Arc A770M GPU)
      # ───────────────────────────────────────────────────────────────
      # For Intel Core™ Ultra Processors (Series 2) with processor number 2xxK or 2xxH (code name Arrow Lake):
      # Enable NPU by default
      - IPEX_LLM_NPU_ARL=${IPEX_LLM_NPU_ARL:-0}

      # For Intel Core™ Ultra Processors (Series 1) with processor number 1xxH (code name Meteor Lake):
      # Disable NPU by default
      - IPEX_LLM_NPU_MTL=${IPEX_LLM_NPU_MTL:-0}

      # ───────────────────────────────────────────────────────────────
      # GPU layer offloading
      # ───────────────────────────────────────────────────────────────
      - OLLAMA_NUM_GPU=${OLLAMA_NUM_GPU:-999}
        # Impact: Number of model layers to put on GPU. 999 = try maximum possible (recommended for discrete Arc).

    command: sh -c 'mkdir -p /llm/ollama && cd /llm/ollama && init-ollama && exec ./ollama serve'

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    volumes:
      - open-webui-volume:/app/backend/data
    depends_on:
      - ollama-intel-arc
    ports:
      - 4040:8080
    environment:
      - OLLAMA_BASE_URL=http://ollama-intel-arc:11434

      # Proxy bypass (see Ollama service for explanation)
      - no_proxy=${no_proxy:-localhost,127.0.0.1,ollama-intel-arc,open-webui}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,ollama-intel-arc,open-webui}

      - WEBUI_AUTH=False
      - ENABLE_OPENAI_API=False
      - ENABLE_OLLAMA_API=True

      # Image generation (requires SD.Next or ComfyUI running)
      - ENABLE_IMAGE_GENERATION=True
      - IMAGE_GENERATION_ENGINE=automatic1111
      - IMAGE_GENERATION_MODEL=dreamshaper_8
      - IMAGE_SIZE=400x400
      - IMAGE_STEPS=8
      - AUTOMATIC1111_BASE_URL=http://sdnext-ipex:7860/
      - AUTOMATIC1111_CFG_SCALE=2
      - AUTOMATIC1111_SAMPLER=DPM++ SDE
      - AUTOMATIC1111_SCHEDULER=Karras

      # Web search for RAG
      - ENABLE_RAG_WEB_SEARCH=True

      # Telemetry opt-out
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  ollama-volume: {}
  open-webui-volume: {}